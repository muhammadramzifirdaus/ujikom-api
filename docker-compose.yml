services:
  # 1. SERVER DATABASE
  mysql-server:
    image: mysql:8.0
    container_name: MySQL-API
    environment:
      MYSQL_DATABASE: ujikom_api
      MYSQL_USER: ujikom_api
      MYSQL_PASSWORD: ujikom_api
      MYSQL_ROOT_PASSWORD: passwordroot
    ports:
      - "3306:3306"
    networks:
      - UJIKOM_API
    volumes:
      - db_data:/var/lib/mysql

  # 2. SERVER BACKEND (LARAVEL)
  app-laravel:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laravel-apis
    dns:
      - 8.8.8.8
      - 8.8.4.4
    working_dir: /var/www
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - mysql-server
    networks:
      - UJIKOM_API

  # 3. SERVER UI DATABASE (PHPMYADMIN)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: PhpMyadmin-API
    environment:
      PMA_HOST: mysql-server
    ports:
      - "8081:80"
    depends_on:
      - mysql-server
    networks:
      - UJIKOM_API

volumes:
  db_data:

networks:
  UJIKOM_API:
    driver: bridge